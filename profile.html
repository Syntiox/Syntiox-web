<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Profile | Syntiox</title>
  <meta name="description" content="Public Profile on Syntiox." />
  <meta name="theme-color" content="#1a73e8" />
  
  <link rel="stylesheet" href="/assets/css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body style="background:#0f172a; color:#f8fafc; font-family: 'Inter', sans-serif;">
  
  <!-- NAV (simplified) -->
  <nav style="padding: 1rem 2rem; border-bottom: 1px solid rgba(255,255,255,0.1); display:flex; align-items:center; gap: 10px;">
    <a href="/" style="color:white; text-decoration:none; display:flex; align-items:center; gap:8px; font-weight:bold;">
      <i class="fa-solid fa-hexagon-nodes" style="color:#3b82f6;"></i> Syntiox
    </a>
  </nav>

  <main style="max-width: 800px; margin: 40px auto; padding: 0 20px;">
    <div id="loading" style="text-align:center; padding: 100px 0;">
      <i class="fa-solid fa-circle-notch fa-spin fa-2x"></i>
      <p style="margin-top:10px; color:#94a3b8;">Loading profile...</p>
    </div>

    <div id="not-found" style="display:none; text-align:center; padding: 100px 0;">
      <i class="fa-solid fa-user-slash fa-3x" style="color:#ef4444;"></i>
      <h2 style="margin-top:20px;">User not found</h2>
      <p style="color:#94a3b8;">This profile doesn't exist or has been removed.</p>
    </div>

    <div id="profile-content" style="display:none; background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 40px; text-align: center; position:relative; overflow:hidden;">
      <div style="position:absolute; top:0; left:0; width:100%; height:120px; background: linear-gradient(135deg, #3b82f6, #8b5cf6); z-index:0;"></div>
      
      <img id="avatar" src="" style="width:100px; height:100px; border-radius:50%; border: 4px solid #1e293b; position:relative; z-index:1; margin-top:30px; background:#1e293b; object-fit:cover;" />
      
      <h1 id="displayName" style="margin: 15px 0 5px; position:relative; z-index:1; font-size:1.8rem;"></h1>
      <p id="username" style="color:#94a3b8; position:relative; z-index:1; margin-bottom:20px;"></p>
      
      <div style="display:flex; justify-content:center; gap: 20px; margin-bottom:30px; position:relative; z-index:1;">
        <div style="background:rgba(255,255,255,0.05); padding: 15px 25px; border-radius:12px;">
          <div style="font-size:0.85rem; color:#94a3b8; margin-bottom:5px;">Coin Balance</div>
          <div style="font-size:1.5rem; font-weight:bold; color:#f59e0b;"><i class="fa-solid fa-coins"></i> <span id="coinBalance">0</span></div>
        </div>
        <div style="background:rgba(255,255,255,0.05); padding: 15px 25px; border-radius:12px;">
          <div style="font-size:0.85rem; color:#94a3b8; margin-bottom:5px;">Joined</div>
          <div style="font-size:1.2rem; font-weight:bold; color:#e2e8f0; margin-top:8px;" id="joinDate">Unknown</div>
        </div>
      </div>
      
      <div id="bio" style="color:#cbd5e1; line-height:1.6; max-width:600px; margin:0 auto; position:relative; z-index:1;"></div>
    </div>
  </main>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  
  <script>
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyCBLr4tTbTCSgqWhPhtcQWIHfvVq5q8WQU",
      authDomain: "atom-md-c71bf.firebaseapp.com",
      projectId: "atom-md-c71bf"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(FIREBASE_CONFIG);
    }
    const db = firebase.firestore();

    async function loadProfile() {
      // Extract username from /u/username
      const pathParts = window.location.pathname.split('/');
      const username = pathParts[pathParts.length - 1];
      
      if (!username || username === 'u') {
          document.getElementById('loading').style.display = 'none';
          document.getElementById('not-found').style.display = 'block';
          return;
      }

      try {
        // Assume username is stored in 'users' collection with a field 'username'
        const usersRef = db.collection('users');
        const snapshot = await usersRef.where('username', '==', username).limit(1).get();
        
        if (snapshot.empty) {
          document.getElementById('loading').style.display = 'none';
          document.getElementById('not-found').style.display = 'block';
          return;
        }

        const userData = snapshot.docs[0].data();
        
        document.getElementById('displayName').textContent = userData.displayName || 'Unknown User';
        document.getElementById('username').textContent = '@' + username;
        document.getElementById('bio').textContent = userData.bio || 'No bio provided.';
        document.getElementById('coinBalance').textContent = userData.coins || 0;
        
        if (userData.createdAt) {
          const d = userData.createdAt.toDate ? userData.createdAt.toDate() : new Date(userData.createdAt);
          document.getElementById('joinDate').textContent = d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
        }
        
        const avatar = userData.photoURL || `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23a855f7'%3E%3Cpath d='M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z'/%3E%3C/svg%3E`;
        document.getElementById('avatar').src = avatar;

        document.getElementById('loading').style.display = 'none';
        document.getElementById('profile-content').style.display = 'block';

      } catch (err) {
        console.error(err);
        document.getElementById('loading').style.display = 'none';
        document.getElementById('not-found').style.display = 'block';
      }
    }

    window.addEventListener('load', loadProfile);
  </script>
<script src="https://account.syntiox.top/assets/js/sso-client.js"></script>
</body>
</html>
