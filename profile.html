<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile | Syntiox</title>
  <meta name="description" content="View profile on Syntiox." />
  <meta name="theme-color" content="#0071e3" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    :root {
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-display: 'Space Grotesk', sans-serif;
      --transition: 0.2s cubic-bezier(0.4,0,0.2,1);
    }

    /* ── Themes ── */
    body[data-theme="default"] {
      --bg: #f5f5f7; --card-bg: #ffffff; --card-border: rgba(0,0,0,0.08);
      --card-shadow: 0 2px 16px rgba(0,0,0,0.08); --text: #1d1d1f; --text2: #6e6e73;
      --link-bg: #ffffff; --link-bg-hover: #f5f5f7; --link-border: rgba(0,0,0,0.1);
      --link-text: #1d1d1f; --badge-bg: rgba(0,0,0,0.06); --badge-text: #6e6e73;
    }
    body[data-theme="midnight"] {
      --bg: #0d0d1a; --card-bg: rgba(255,255,255,0.05); --card-border: rgba(255,255,255,0.1);
      --card-shadow: 0 8px 40px rgba(0,0,0,0.4); --text: #f0f0ff; --text2: rgba(240,240,255,0.6);
      --link-bg: rgba(255,255,255,0.07); --link-bg-hover: rgba(255,255,255,0.13);
      --link-border: rgba(255,255,255,0.12); --link-text: #f0f0ff;
      --badge-bg: rgba(255,255,255,0.08); --badge-text: rgba(240,240,255,0.5);
    }
    body[data-theme="aurora"] {
      --bg: #0a1f1a; --card-bg: rgba(255,255,255,0.06); --card-border: rgba(52,211,153,0.2);
      --card-shadow: 0 8px 40px rgba(0,0,0,0.35); --text: #e0fff5; --text2: rgba(200,255,230,0.6);
      --link-bg: rgba(52,211,153,0.1); --link-bg-hover: rgba(52,211,153,0.18);
      --link-border: rgba(52,211,153,0.2); --link-text: #e0fff5;
      --badge-bg: rgba(52,211,153,0.1); --badge-text: rgba(200,255,230,0.55);
    }
    body[data-theme="sunset"] {
      --bg: #1a0a0a; --card-bg: rgba(255,255,255,0.06); --card-border: rgba(251,146,60,0.2);
      --card-shadow: 0 8px 40px rgba(0,0,0,0.4); --text: #fff5f0; --text2: rgba(255,230,215,0.6);
      --link-bg: rgba(251,146,60,0.1); --link-bg-hover: rgba(251,146,60,0.18);
      --link-border: rgba(251,146,60,0.2); --link-text: #fff5f0;
      --badge-bg: rgba(251,146,60,0.1); --badge-text: rgba(255,230,215,0.55);
    }
    body[data-theme="ocean"] {
      --bg: #030d1a; --card-bg: rgba(255,255,255,0.05); --card-border: rgba(56,189,248,0.18);
      --card-shadow: 0 8px 40px rgba(0,0,0,0.45); --text: #e0f7ff; --text2: rgba(200,240,255,0.6);
      --link-bg: rgba(56,189,248,0.08); --link-bg-hover: rgba(56,189,248,0.15);
      --link-border: rgba(56,189,248,0.18); --link-text: #e0f7ff;
      --badge-bg: rgba(56,189,248,0.08); --badge-text: rgba(200,240,255,0.55);
    }
    body[data-theme="forest"] {
      --bg: #0a1a0d; --card-bg: rgba(255,255,255,0.05); --card-border: rgba(74,222,128,0.18);
      --card-shadow: 0 8px 40px rgba(0,0,0,0.4); --text: #efffef; --text2: rgba(200,255,200,0.6);
      --link-bg: rgba(74,222,128,0.08); --link-bg-hover: rgba(74,222,128,0.15);
      --link-border: rgba(74,222,128,0.2); --link-text: #efffef;
      --badge-bg: rgba(74,222,128,0.08); --badge-text: rgba(200,255,200,0.55);
    }
    body[data-theme="rose"] {
      --bg: #1a0a12; --card-bg: rgba(255,255,255,0.05); --card-border: rgba(251,113,133,0.2);
      --card-shadow: 0 8px 40px rgba(0,0,0,0.4); --text: #fff0f5; --text2: rgba(255,210,225,0.6);
      --link-bg: rgba(251,113,133,0.09); --link-bg-hover: rgba(251,113,133,0.17);
      --link-border: rgba(251,113,133,0.2); --link-text: #fff0f5;
      --badge-bg: rgba(251,113,133,0.09); --badge-text: rgba(255,210,225,0.55);
    }
    body[data-theme="mono"] {
      --bg: #000000; --card-bg: #111111; --card-border: rgba(255,255,255,0.08);
      --card-shadow: 0 8px 40px rgba(0,0,0,0.6); --text: #ffffff; --text2: rgba(255,255,255,0.5);
      --link-bg: #1a1a1a; --link-bg-hover: #222222; --link-border: rgba(255,255,255,0.1);
      --link-text: #ffffff; --badge-bg: rgba(255,255,255,0.06); --badge-text: rgba(255,255,255,0.4);
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { font-size:16px; scroll-behavior:smooth; }
    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      transition: background 0.3s, color 0.3s;
    }
    body:not([data-theme="default"]) {
      background-image: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(255,255,255,0.04) 0%, transparent 60%);
    }

    .page-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px 80px;
    }
    .profile-card {
      width: 100%;
      max-width: 540px;
      animation: fadeUp 0.5s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(24px); }
      to   { opacity:1; transform:translateY(0); }
    }

    /* Avatar */
    .profile-header { text-align:center; margin-bottom:32px; }
    .avatar-wrap { position:relative; display:inline-block; margin-bottom:16px; }
    .avatar {
      width:96px; height:96px; border-radius:50%; object-fit:cover;
      border:3px solid var(--card-border); background:var(--card-bg); display:block;
    }
    .avatar-ring {
      position:absolute; inset:-4px; border-radius:50%;
      border:2px solid var(--accent-color, #0071e3); opacity:0.5;
      animation:ring-pulse 3s ease-in-out infinite;
    }
    @keyframes ring-pulse {
      0%,100% { opacity:0.3; transform:scale(1); }
      50%      { opacity:0.7; transform:scale(1.04); }
    }
    .display-name {
      font-family:var(--font-display); font-size:1.65rem; font-weight:800;
      letter-spacing:-0.03em; color:var(--text); margin-bottom:4px;
    }
    .username-handle { font-size:0.9rem; color:var(--text2); margin-bottom:12px; font-weight:500; }
    .bio { font-size:0.95rem; color:var(--text2); line-height:1.65; max-width:400px; margin:0 auto; }

    /* Links */
    .links-section { display:flex; flex-direction:column; gap:12px; margin-bottom:32px; }
    .link-item {
      display:flex; align-items:center; gap:14px;
      padding:14px 18px; background:var(--link-bg);
      border:1px solid var(--link-border); border-radius:14px;
      text-decoration:none; color:var(--link-text);
      font-weight:600; font-size:0.95rem; cursor:pointer;
      transition:all var(--transition); position:relative; overflow:hidden;
    }
    .link-item::before {
      content:''; position:absolute; inset:0;
      background:var(--link-bg-hover); opacity:0; transition:opacity var(--transition);
    }
    .link-item:hover::before { opacity:1; }
    .link-item:hover { transform:translateY(-2px); box-shadow:var(--card-shadow); }
    .link-item:active { transform:translateY(0); }
    .link-icon {
      width:36px; height:36px; border-radius:10px;
      background:var(--accent-color, #0071e3);
      display:flex; align-items:center; justify-content:center;
      color:white; font-size:0.9rem; flex-shrink:0; position:relative; z-index:1;
    }
    .link-title { flex:1; position:relative; z-index:1; }
    .link-arrow {
      color:var(--text2); font-size:0.8rem; position:relative; z-index:1;
      transition:transform var(--transition);
    }
    .link-item:hover .link-arrow { transform:translateX(3px); }

    .empty-links {
      text-align:center; padding:40px 24px; color:var(--text2); font-size:0.9rem;
      background:var(--link-bg); border:1px dashed var(--link-border); border-radius:16px;
    }
    .empty-links i { font-size:2rem; margin-bottom:12px; display:block; opacity:0.4; }

    /* Share bar */
    .share-bar { display:flex; gap:10px; margin-bottom:28px; justify-content:center; }
    .share-btn {
      display:inline-flex; align-items:center; gap:7px;
      padding:8px 18px; border-radius:9999px; font-size:0.83rem; font-weight:600;
      font-family:var(--font-sans); cursor:pointer;
      border:1px solid var(--link-border); background:var(--link-bg);
      color:var(--text2); transition:all var(--transition);
    }
    .share-btn:hover { background:var(--link-bg-hover); color:var(--text); transform:translateY(-1px); }

    /* Syntiox badge */
    .syntiox-badge { text-align:center; margin-top:auto; padding-top:20px; }
    .syntiox-badge a {
      display:inline-flex; align-items:center; gap:7px;
      padding:8px 16px; background:var(--badge-bg); color:var(--badge-text);
      border-radius:9999px; text-decoration:none; font-size:0.78rem;
      font-weight:600; font-family:var(--font-sans); transition:all var(--transition);
    }
    .syntiox-badge a:hover { background:var(--link-bg-hover); color:var(--text); }
    .syntiox-badge img { width:16px; height:16px; object-fit:contain; }

    /* Loader / Error */
    .loader-wrap {
      display:flex; flex-direction:column; align-items:center;
      justify-content:center; min-height:60vh; gap:16px; color:var(--text2);
    }
    .spinner {
      width:40px; height:40px; border:3px solid rgba(255,255,255,0.1);
      border-top-color:var(--accent-color, #0071e3); border-radius:50%;
      animation:spin 0.8s linear infinite;
    }
    body[data-theme="default"] .spinner { border-color:rgba(0,0,0,0.1); border-top-color:#0071e3; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .error-box { text-align:center; padding:48px 24px; color:var(--text2); }
    .error-code { font-family:var(--font-display); font-size:4rem; font-weight:800; letter-spacing:-0.05em; color:var(--text); margin-bottom:8px; }
    .error-box p { font-size:0.95rem; margin-bottom:20px; }
    .error-box a { color:var(--accent-color,#0071e3); text-decoration:underline; font-weight:600; }

    @media (max-width:600px) {
      .page-wrap { padding:40px 16px 60px; }
      .display-name { font-size:1.4rem; }
    }
  </style>
</head>
<body data-theme="default">

  <div class="page-wrap">
    <div id="root">
      <div class="loader-wrap">
        <div class="spinner"></div>
        <span>Loading profile…</span>
      </div>
    </div>
  </div>

  <!-- Firebase (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>
  (function() {
    'use strict';

    // ── Firebase config ──────────────────────────────
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyCBLr4tTbTCSgqWhPhtcQWIHfvVq5q8WQU",
      authDomain: "atom-md-c71bf.firebaseapp.com",
      projectId: "atom-md-c71bf",
      storageBucket: "atom-md-c71bf.firebasestorage.app",
      messagingSenderId: "479030560097",
      appId: "1:479030560097:web:c3e5ffb2b3761772cef120"
    };
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);

    // ── Social icon auto-detect ──────────────────────
    const ICON_MAP = [
      { match: /youtube\.com|youtu\.be/i,      icon: 'fa-brands fa-youtube',    color: '#ff0000' },
      { match: /github\.com/i,                  icon: 'fa-brands fa-github',     color: '#333'    },
      { match: /twitter\.com|x\.com/i,          icon: 'fa-brands fa-x-twitter',  color: '#000'    },
      { match: /instagram\.com/i,               icon: 'fa-brands fa-instagram',  color: '#e1306c' },
      { match: /tiktok\.com/i,                  icon: 'fa-brands fa-tiktok',     color: '#010101' },
      { match: /linkedin\.com/i,                icon: 'fa-brands fa-linkedin',   color: '#0077b5' },
      { match: /discord\.gg|discord\.com/i,     icon: 'fa-brands fa-discord',    color: '#5865f2' },
      { match: /twitch\.tv/i,                   icon: 'fa-brands fa-twitch',     color: '#9146ff' },
      { match: /spotify\.com/i,                 icon: 'fa-brands fa-spotify',    color: '#1db954' },
      { match: /whatsapp\.com|wa\.me/i,         icon: 'fa-brands fa-whatsapp',   color: '#25d366' },
      { match: /t\.me|telegram\.me/i,           icon: 'fa-brands fa-telegram',   color: '#0088cc' },
      { match: /facebook\.com/i,                icon: 'fa-brands fa-facebook',   color: '#1877f2' },
      { match: /patreon\.com/i,                 icon: 'fa-brands fa-patreon',    color: '#ff424d' },
      { match: /reddit\.com/i,                  icon: 'fa-brands fa-reddit',     color: '#ff4500' },
      { match: /pinterest\.com/i,               icon: 'fa-brands fa-pinterest',  color: '#e60023' },
      { match: /snapchat\.com/i,                icon: 'fa-brands fa-snapchat',   color: '#fffc00' },
      { match: /behance\.net/i,                 icon: 'fa-brands fa-behance',    color: '#053eff' },
      { match: /dribbble\.com/i,                icon: 'fa-brands fa-dribbble',   color: '#ea4c89' },
      { match: /medium\.com/i,                  icon: 'fa-brands fa-medium',     color: '#000'    },
      { match: /soundcloud\.com/i,              icon: 'fa-brands fa-soundcloud', color: '#ff5500' },
    ];

    function detectIcon(url, accentColor) {
      for (const entry of ICON_MAP) {
        if (entry.match.test(url)) return entry;
      }
      return { icon: 'fa-solid fa-link', color: accentColor || '#0071e3' };
    }

    function defaultAvatar(name) {
      const init = (name || '?').charAt(0).toUpperCase();
      return `data:image/svg+xml,${encodeURIComponent(
        `<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96"><circle cx="48" cy="48" r="48" fill="#0071e3"/><text x="48" y="64" text-anchor="middle" font-size="40" font-family="Inter,sans-serif" fill="#fff" font-weight="700">${init}</text></svg>`
      )}`;
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function render(data) {
      const { displayName, username, bio, photoURL, links = [], theme, accentColor } = data;

      // Apply theme
      document.body.setAttribute('data-theme', theme || 'default');
      if (accentColor) document.body.style.setProperty('--accent-color', accentColor);

      // Update meta
      document.title = `${displayName || username} | Syntiox`;
      const metaDesc = document.querySelector('meta[name="description"]');
      if (metaDesc) metaDesc.content = bio || `${displayName || username}'s profile on Syntiox`;

      const accent = accentColor || '#0071e3';
      const pageUrl = `https://syntiox.top/u/${username}`;

      let linksHtml = '';
      if (links.length === 0) {
        linksHtml = `<div class="empty-links"><i class="fa-solid fa-link-slash"></i>No links added yet.</div>`;
      } else {
        linksHtml = links.map(link => {
          const iconInfo = detectIcon(link.url, accent);
          return `
            <a class="link-item" href="${escapeHtml(link.url)}" target="_blank" rel="noopener noreferrer">
              <span class="link-icon" style="background:${iconInfo.color};"><i class="${iconInfo.icon}"></i></span>
              <span class="link-title">${escapeHtml(link.title)}</span>
              <i class="fa-solid fa-arrow-right link-arrow"></i>
            </a>`;
        }).join('');
      }

      document.getElementById('root').innerHTML = `
        <div class="profile-card">
          <div class="profile-header">
            <div class="avatar-wrap">
              <img class="avatar" src="${photoURL || defaultAvatar(displayName)}" alt="${escapeHtml(displayName || username)}" referrerpolicy="no-referrer" />
              <div class="avatar-ring"></div>
            </div>
            <h1 class="display-name">${escapeHtml(displayName || username || 'Unknown')}</h1>
            ${username ? `<p class="username-handle">@${escapeHtml(username)}</p>` : ''}
            ${bio ? `<p class="bio">${escapeHtml(bio)}</p>` : ''}
          </div>

          <div class="share-bar">
            <button class="share-btn" id="btn-copy-link">
              <i class="fa-solid fa-copy"></i> Copy Link
            </button>
            ${navigator.share ? `<button class="share-btn" id="btn-native-share"><i class="fa-solid fa-share-nodes"></i> Share</button>` : ''}
          </div>

          <div class="links-section">${linksHtml}</div>

          <div class="syntiox-badge">
            <a href="https://syntiox.top" target="_blank" rel="noopener">
              <img src="https://syntiox.top/assets/logo-IcotzT0R.png" alt="Syntiox" />
              Built with Syntiox
            </a>
          </div>
        </div>
      `;

      document.getElementById('btn-copy-link').addEventListener('click', () => {
        navigator.clipboard.writeText(pageUrl).then(() => {
          const btn = document.getElementById('btn-copy-link');
          const orig = btn.innerHTML;
          btn.innerHTML = '<i class="fa-solid fa-check"></i> Copied!';
          setTimeout(() => { btn.innerHTML = orig; }, 2000);
        });
      });

      if (navigator.share) {
        document.getElementById('btn-native-share')?.addEventListener('click', () => {
          navigator.share({ title: `${displayName}'s Profile`, url: pageUrl });
        });
      }
    }

    function renderError(code, msg) {
      document.getElementById('root').innerHTML = `
        <div class="profile-card">
          <div class="error-box">
            <div class="error-code">${code}</div>
            <p>${msg}</p>
            <a href="https://syntiox.top">Go to Syntiox</a>
          </div>
        </div>`;
    }

    async function main() {
      const params = new URLSearchParams(window.location.search);

      // Vercel rewrites keep the original browser URL (/u/username),
      // so we extract the username directly from the pathname.
      const pathMatch = window.location.pathname.match(/^\/u\/([^/]+)/);
      const handle = (pathMatch && pathMatch[1])
                  || params.get('handle')
                  || params.get('u')
                  || '';

      if (!handle) {
        renderError('404', 'No username specified.');
        return;
      }

      try {
        const db = firebase.firestore();

        // Lookup UID from /usernames collection
        const unameSnap = await db.collection('usernames').doc(handle.toLowerCase()).get();
        if (!unameSnap.exists) {
          renderError('404', `@${escapeHtml(handle)} doesn't exist on Syntiox.`);
          return;
        }

        const uid = unameSnap.data().uid;
        const userSnap = await db.collection('users').doc(uid).get();

        if (!userSnap.exists) {
          renderError('404', 'User profile not found.');
          return;
        }

        const data = userSnap.data();
        if (data.isPublic === false) {
          renderError('🔒', 'This profile is private.');
          return;
        }

        render(data);

      } catch (err) {
        console.error('[Profile page]', err);
        renderError('⚠', 'Could not load profile. Please try again.');
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', main);
    } else {
      main();
    }
  })();
  </script>
</body>
</html>
