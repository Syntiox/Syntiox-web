<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile | Syntiox</title>
  <meta name="description" content="View this profile on Syntiox." />
  <meta name="theme-color" content="#0071e3" />

  <meta property="og:type" content="profile" />
  <meta property="og:title" content="Profile | Syntiox" />
  <meta property="og:description" content="View this profile on Syntiox." />
  <meta property="og:image" id="og-image" content="/assets/image/logo.png" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Profile | Syntiox" />
  <meta name="twitter:description" content="View this profile on Syntiox." />
  <meta name="twitter:image" id="tw-image" content="/assets/image/logo.png" />
  <link rel="icon" href="/assets/image/favicon.png" type="image/png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="/assets/css/profile.css" />
</head>
<body data-engine="bento" data-mode="light" data-animations="on">
  <div id="root">
    <div class="skeleton-shell" aria-label="Loading profile">
      <div class="sk-card">
        <div class="sk-row">
          <div class="sk-avatar"></div>
          <div class="sk-lines">
            <div class="sk-line sk-w40"></div>
            <div class="sk-line sk-w25"></div>
          </div>
        </div>
        <div class="sk-line sk-w80"></div>
        <div class="sk-line sk-w60"></div>
      </div>
      <div class="sk-grid">
        <div class="sk-stat"></div>
        <div class="sk-stat"></div>
        <div class="sk-stat"></div>
      </div>
      <div class="sk-link"></div>
      <div class="sk-link"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>
  (function() {
    'use strict';

    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyDCQ1yq4ySr0HC4j1ksSWR7lUdPHvD1UCI",
      authDomain: "syntiox-services.firebaseapp.com",
      projectId: "syntiox-services",
      storageBucket: "syntiox-services.firebasestorage.app",
      messagingSenderId: "598071864083",
      appId: "1:598071864083:web:b69d5c4fc85c9a9a1008e6",
      measurementId: "G-NXWXP64BLR"
    };

    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);

    const ICON_MAP = [
      { m:/youtube\.com|youtu\.be/i,   i:'fa-brands fa-youtube' },
      { m:/github\.com/i,               i:'fa-brands fa-github' },
      { m:/twitter\.com|x\.com/i,       i:'fa-brands fa-x-twitter' },
      { m:/instagram\.com/i,            i:'fa-brands fa-instagram' },
      { m:/tiktok\.com/i,               i:'fa-brands fa-tiktok' },
      { m:/linkedin\.com/i,             i:'fa-brands fa-linkedin' },
      { m:/discord\.gg|discord\.com/i,  i:'fa-brands fa-discord' },
      { m:/twitch\.tv/i,                i:'fa-brands fa-twitch' },
      { m:/spotify\.com/i,              i:'fa-brands fa-spotify' },
      { m:/whatsapp\.com|wa\.me/i,      i:'fa-brands fa-whatsapp' },
      { m:/t\.me|telegram\./i,          i:'fa-brands fa-telegram' },
      { m:/facebook\.com/i,             i:'fa-brands fa-facebook' },
      { m:/patreon\.com/i,              i:'fa-brands fa-patreon' },
      { m:/reddit\.com/i,               i:'fa-brands fa-reddit' },
      { m:/pinterest\.com/i,            i:'fa-brands fa-pinterest' },
      { m:/snapchat\.com/i,             i:'fa-brands fa-snapchat' },
      { m:/medium\.com/i,               i:'fa-brands fa-medium' },
    ];

    function formatUrl(url) {
      if (!url) return '';
      url = String(url).trim();
      if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(url)) return url;
      return 'https://' + url;
    }

    function detectIcon(url) {
      for (const e of ICON_MAP) {
        if (e.m.test(url)) return e.i;
      }
      return 'fa-solid fa-link';
    }

    function getHostname(url) {
      try {
        const u = formatUrl(url);
        return new URL(u).hostname.replace(/^www\./, '');
      } catch {
        return '';
      }
    }

    function hexToRgb(hex) {
      try {
        hex = String(hex || '').replace('#', '').trim();
        if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
        if (!/^[0-9a-fA-F]{6}$/.test(hex)) return '0, 113, 227';
        const n = parseInt(hex, 16);
        return `${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}`;
      } catch {
        return '0, 113, 227';
      }
    }

    function defaultAvatar(name, accent) {
      const c = (name || '?')[0].toUpperCase();
      const bg = accent || '#0f172a';
      return `data:image/svg+xml,${encodeURIComponent(
        `<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96"><rect width="96" height="96" fill="${bg}"/><text x="48" y="62" text-anchor="middle" font-size="38" font-family="Inter,sans-serif" fill="#ffffff" font-weight="600">${c}</text></svg>`
      )}`;
    }

    function esc(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function formatShortCurrency(value) {
      const num = Number(value) || 0;
      if (num === 0) return "0";
      if (num >= 1e9) return (num / 1e9).toFixed(1).replace(/\.0$/, '') + 'B';
      if (num >= 1e6) return (num / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
      if (num >= 1e3) return (num / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
      return num % 1 === 0 ? String(num) : num.toFixed(2).replace(/\.00$/, '');
    }

    function render(userData) {
      const {
        displayName, username, bio, photoURL,
        links = [], appearance = {}, coins, social = {}, verified = false,
        isAdmin = false
      } = userData;

      const engine = appearance.layoutEngine || (appearance.template === 'minimal' ? 'executive' : 'bento');
      const mode = appearance.themeMode || (appearance.template?.includes('dark') || appearance.bgType === 'gradient' ? 'dark' : 'light');
      const rawAccent = appearance.accentColor || '#0071e3';
      const accent = (mode === 'dark' && rawAccent.toLowerCase() === '#0f172a') ? '#e2e8f0' : rawAccent;
      const animationsOn = appearance.enableAnimations !== false;

      document.body.dataset.engine = engine;
      document.body.dataset.mode = mode;
      document.body.dataset.animations = animationsOn ? 'on' : 'off';
      document.body.style.setProperty('--pg-accent', accent);
      document.body.style.setProperty('--pg-accent-rgb', hexToRgb(accent));

      document.title = `${displayName || username} | Syntiox`;
      const metaDesc = document.querySelector('meta[name="description"]');
      if (metaDesc) metaDesc.content = bio || `${displayName || username}'s profile on Syntiox`;

      const pageUrl = `${window.location.origin}/u/${username}`;

      function updateMetaTag(attr, attrVal, content) {
        if (!content) return;
        const selector = 'meta[' + attr + '="' + attrVal + '"]';
        let el = document.querySelector(selector);
        if (!el) {
          el = document.createElement('meta');
          el.setAttribute(attr, attrVal);
          document.head.appendChild(el);
        }
        el.setAttribute('content', content);
      }

      const showPhoto = appearance.showMetadataPhoto !== false;
      const rawPhoto = photoURL || userData.avatar || '';
      const userPhoto = (showPhoto && rawPhoto) || '';

      updateMetaTag('property', 'og:title', `${displayName || username} | Syntiox`);
      updateMetaTag('property', 'og:description', bio || `View ${displayName || username}'s profile on Syntiox.`);
      updateMetaTag('property', 'og:url', pageUrl);
      updateMetaTag('property', 'og:type', 'profile');

      if (userPhoto) {
        updateMetaTag('property', 'og:image', userPhoto);
        updateMetaTag('name', 'twitter:image', userPhoto);
        updateMetaTag('name', 'twitter:card', 'summary_large_image');
      } else {
        updateMetaTag('property', 'og:image', `${window.location.origin}/assets/image/logo.png`);
        updateMetaTag('name', 'twitter:card', 'summary');
      }
      updateMetaTag('name', 'twitter:title', `${displayName || username} | Syntiox`);
      updateMetaTag('name', 'twitter:description', bio || `View ${displayName || username}'s profile on Syntiox.`);

      if (userData.uid) {
        fetch('https://account.syntiox.top/api/analytics', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ uid: userData.uid, type: 'view' }),
        }).catch(() => {});
      }

      const storedUid = localStorage.getItem('syntiox_uid');
      const isOwner = storedUid && userData.uid === storedUid;
      const editBtn = isOwner
        ? `<div class="owner-bar"><a class="owner-edit-link" href="https://account.syntiox.top"><i class="fa-solid fa-pen"></i> Edit Profile</a></div>`
        : '';

      const verifiedBadge = verified
        ? `<span class="verified-badge" title="Verified"><i class="fa-solid fa-check"></i></span>`
        : '';

      const staffBadge = isAdmin
        ? `<span class="staff-badge" title="Syntiox Staff"><i class="fa-solid fa-shield-halved"></i> Staff</span>`
        : '';

      const handleBtn = username
        ? `<button type="button" class="handle-copy" id="btn-copy-handle" title="Copy profile link"><span>@${esc(username)}</span><i class="fa-regular fa-copy" id="copy-ic"></i></button>`
        : '';

      const showWallet = appearance.showWalletBalance !== false;
      const showCoins = appearance.showCoinsBalance !== false;
      const showViews = appearance.showViewCount !== false;
      const showIcons = appearance.linkShowIcon !== false;

      const walletVal = userData.wallet_balance ?? userData.walletBalance ?? userData.wallet ?? 0;
      const coinsVal = coins ?? userData.apiCoins ?? 0;
      const viewsVal = userData.profileViews ?? userData.views ?? 0;
      const avatarSrc = rawPhoto || defaultAvatar(displayName || username, rawAccent);

      const SOCIAL_DEFS = [
        { id:'github',   label:'GitHub',      icon:'fa-brands fa-github',    prefix:'https://github.com/' },
        { id:'twitter',  label:'X (Twitter)', icon:'fa-brands fa-x-twitter', prefix:'https://x.com/' },
        { id:'linkedin', label:'LinkedIn',    icon:'fa-brands fa-linkedin',  prefix:'https://linkedin.com/in/' },
        { id:'youtube',  label:'YouTube',     icon:'fa-brands fa-youtube',   prefix:'https://youtube.com/' },
        { id:'telegram', label:'Telegram',    icon:'fa-brands fa-telegram',  prefix:'https://t.me/' },
        { id:'whatsapp', label:'WhatsApp',    icon:'fa-brands fa-whatsapp',  prefix:'https://wa.me/' },
        { id:'email',    label:'Email',       icon:'fa-solid fa-envelope',   prefix:'mailto:' },
      ];

      const socialHtml = SOCIAL_DEFS.filter(s => social && social[s.id]).map(s => {
        let val = String(social[s.id]).trim();
        if (!val) return '';
        let rawUrl;
        if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(val)) {
          rawUrl = val;
        } else {
          if (s.id === 'linkedin' && val.startsWith('in/')) val = val.slice(3);
          if (val.startsWith('@') && s.id !== 'youtube') val = val.slice(1);
          rawUrl = `${s.prefix}${val}`;
        }
        const redirectUrl = `https://account.syntiox.top/api/redirect?uid=${userData.uid||''}&key=Social%3A%20${encodeURIComponent(s.label||s.id)}&url=${encodeURIComponent(rawUrl)}`;
        return `<a class="social-ic" href="${esc(redirectUrl)}" target="_blank" rel="noopener" title="${esc(s.label||s.id)}"><i class="${s.icon}"></i></a>`;
      }).filter(Boolean).join('');

      let contentHtml = '';

      // 1. BENTO GRID ENGINE
      if (engine === 'bento') {
        const statsWidgets = [];
        if (showWallet) {
          statsWidgets.push(`
            <div class="bento-card bento-stat">
              <span class="bento-stat-lbl">Wallet Balance</span>
              <span class="bento-stat-val">$${formatShortCurrency(walletVal)}</span>
            </div>`);
        }
        if (showCoins) {
          statsWidgets.push(`
            <div class="bento-card bento-stat">
              <span class="bento-stat-lbl">API Coins</span>
              <span class="bento-stat-val">${formatShortCurrency(coinsVal)}</span>
            </div>`);
        }
        if (showViews) {
          statsWidgets.push(`
            <div class="bento-card bento-stat">
              <span class="bento-stat-lbl">Profile Views</span>
              <span class="bento-stat-val">${formatShortCurrency(viewsVal)}</span>
            </div>`);
        }

        const linksBento = links.map(link => {
          if (!link || !link.url) return '';
          const targetUrl = formatUrl(link.url);
          const icon = (link.icon && link.icon !== 'auto') ? link.icon : detectIcon(targetUrl);
          const host = getHostname(targetUrl);
          const redirectUrl = `https://account.syntiox.top/api/redirect?uid=${userData.uid||''}&key=${encodeURIComponent(link.title||'Link')}&url=${encodeURIComponent(targetUrl)}`;
          return `
            <a class="bento-link" href="${esc(redirectUrl)}" target="_blank" rel="noopener noreferrer">
              <div class="bento-link-left">
                ${showIcons ? `<div class="link-ic-box"><i class="${icon}"></i></div>` : ''}
                <div class="bento-link-meta">
                  <span class="bento-link-title">${esc(link.title || 'Link')}</span>
                  ${host ? `<span class="bento-link-host">${esc(host)}</span>` : ''}
                </div>
              </div>
              <i class="fa-solid fa-arrow-up-right-from-square bento-link-arrow"></i>
            </a>`;
        }).filter(Boolean).join('');

        contentHtml = `
          <div class="bento-container">
            ${editBtn}
            <div class="bento-card bento-hero anim-item">
              <div class="bento-hero-top">
                ${isAdmin
                  ? `<div class="admin-avatar-wrap"><div class="admin-ring"></div><img class="bento-avatar" src="${avatarSrc}" alt="${esc(displayName||username)}" referrerpolicy="no-referrer" /></div>`
                  : `<img class="bento-avatar" src="${avatarSrc}" alt="${esc(displayName||username)}" referrerpolicy="no-referrer" />`}
                <div class="bento-hero-info">
                  <h1>${esc(displayName || username || 'User')}${verifiedBadge}${staffBadge}</h1>
                  ${handleBtn}
                </div>
              </div>
              ${bio ? `<p class="bento-bio">${esc(bio)}</p>` : ''}
              ${socialHtml ? `<div class="social-row">${socialHtml}</div>` : ''}
            </div>
            ${statsWidgets.length ? `<div class="bento-stats-grid anim-item anim-d1">${statsWidgets.join('')}</div>` : ''}
            ${linksBento ? `<div class="bento-links-list anim-item anim-d2">${linksBento}</div>` : ''}
          </div>`;
      }

      // 2. EDITORIAL DOCUMENT ENGINE
      else if (engine === 'editorial') {
        const editorialStats = [];
        if (showWallet) editorialStats.push(`<div class="editorial-stat-item"><span class="editorial-stat-lbl">Wallet</span><span class="editorial-stat-val">$${formatShortCurrency(walletVal)}</span></div>`);
        if (showCoins) editorialStats.push(`<div class="editorial-stat-item"><span class="editorial-stat-lbl">API Coins</span><span class="editorial-stat-val">${formatShortCurrency(coinsVal)}</span></div>`);
        if (showViews) editorialStats.push(`<div class="editorial-stat-item"><span class="editorial-stat-lbl">Views</span><span class="editorial-stat-val">${formatShortCurrency(viewsVal)}</span></div>`);

        const linksEditorial = links.map((link, idx) => {
          if (!link || !link.url) return '';
          const targetUrl = formatUrl(link.url);
          const icon = (link.icon && link.icon !== 'auto') ? link.icon : detectIcon(targetUrl);
          const redirectUrl = `https://account.syntiox.top/api/redirect?uid=${userData.uid||''}&key=${encodeURIComponent(link.title||'Link')}&url=${encodeURIComponent(targetUrl)}`;
          const num = String(idx + 1).padStart(2, '0');
          return `
            <a class="editorial-link-row" href="${esc(redirectUrl)}" target="_blank" rel="noopener noreferrer">
              <div class="editorial-link-left">
                <span class="editorial-num">${num}</span>
                ${showIcons ? `<i class="${icon} editorial-link-ic"></i>` : ''}
                <span class="editorial-link-title">${esc(link.title || 'Link')}</span>
              </div>
              <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:11px;color:var(--pg-text-muted);"></i>
            </a>`;
        }).filter(Boolean).join('');

        contentHtml = `
          <div class="editorial-container">
            ${editBtn}
            <div class="editorial-header anim-item">
              <div class="editorial-top-row">
                ${isAdmin
                  ? `<div class="admin-avatar-wrap"><div class="admin-ring"></div><img class="editorial-avatar" src="${avatarSrc}" alt="${esc(displayName||username)}" referrerpolicy="no-referrer" /></div>`
                  : `<img class="editorial-avatar" src="${avatarSrc}" alt="${esc(displayName||username)}" referrerpolicy="no-referrer" />`}
                <div>
                  <h1 class="editorial-name">${esc(displayName || username || 'User')}${verifiedBadge}${staffBadge}</h1>
                  ${handleBtn}
                </div>
              </div>
              ${bio ? `<p class="editorial-bio">${esc(bio)}</p>` : ''}
              ${socialHtml ? `<div class="social-row">${socialHtml}</div>` : ''}
            </div>
            ${editorialStats.length ? `<div class="editorial-stats-bar anim-item anim-d1">${editorialStats.join('')}</div>` : `<div class="editorial-divider"></div>`}
            ${linksEditorial ? `
              <div class="anim-item anim-d2">
                <p class="editorial-section-title">Index &amp; Links</p>
                <div class="editorial-links-list">${linksEditorial}</div>
              </div>` : ''}
          </div>`;
      }

      // 3. DEVELOPER SPEC SHEET ENGINE
      else if (engine === 'dev-spec') {
        const devBadges = [];
        if (showWallet) devBadges.push(`<span class="dev-badge"><span class="lbl">WALLET</span> $${formatShortCurrency(walletVal)}</span>`);
        if (showCoins) devBadges.push(`<span class="dev-badge"><span class="lbl">COINS</span> ${formatShortCurrency(coinsVal)}</span>`);
        if (showViews) devBadges.push(`<span class="dev-badge"><span class="lbl">VIEWS</span> ${formatShortCurrency(viewsVal)}</span>`);

        const linksDev = links.map(link => {
          if (!link || !link.url) return '';
          const targetUrl = formatUrl(link.url);
          const icon = (link.icon && link.icon !== 'auto') ? link.icon : detectIcon(targetUrl);
          const host = getHostname(targetUrl) || 'endpoint';
          const redirectUrl = `https://account.syntiox.top/api/redirect?uid=${userData.uid||''}&key=${encodeURIComponent(link.title||'Link')}&url=${encodeURIComponent(targetUrl)}`;
          return `
            <a class="dev-repo-card" href="${esc(redirectUrl)}" target="_blank" rel="noopener noreferrer">
              <div class="dev-repo-top">
                <div class="dev-repo-title-wrap">
                  ${showIcons ? `<i class="${icon}" style="color:var(--pg-text-muted);font-size:14px;"></i>` : ''}
                  <span class="dev-repo-title">${esc(link.title || 'Link')}</span>
                </div>
                <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:11px;color:var(--pg-text-muted);"></i>
              </div>
              <span class="dev-repo-host">${esc(host)}</span>
            </a>`;
        }).filter(Boolean).join('');

        contentHtml = `
          <div class="dev-container">
            ${editBtn}
            <div class="dev-header-card anim-item">
              <div class="dev-top-bar">
                <div class="dev-identity">
                  <div class="dev-avatar-wrap ${isAdmin ? 'admin-avatar-wrap' : ''}">
                    ${isAdmin ? '<div class="admin-ring"></div>' : ''}
                    <img class="dev-avatar" src="${avatarSrc}" alt="${esc(displayName||username)}" referrerpolicy="no-referrer" />
                  </div>
                  <div class="dev-info">
                    <h1>${esc(displayName || username || 'User')}${verifiedBadge}${staffBadge}</h1>
                    ${handleBtn}
                  </div>
                </div>
              </div>
              ${bio ? `<p class="dev-bio">${esc(bio)}</p>` : ''}
              ${devBadges.length ? `<div class="dev-telemetry">${devBadges.join('')}</div>` : ''}
              ${socialHtml ? `<div class="social-row">${socialHtml}</div>` : ''}
            </div>
            ${linksDev ? `
              <div class="anim-item anim-d1" style="display:flex;flex-direction:column;gap:10px;">
                <p class="dev-repos-title">// PINNED_LINKS</p>
                <div class="dev-cards-grid">${linksDev}</div>
              </div>` : ''}
          </div>`;
      }

      // 4. EXECUTIVE MINIMALIST ENGINE
      else {
        const execStats = [];
        if (showWallet) execStats.push(`<span class="exec-stat-pill">Wallet <strong>$${formatShortCurrency(walletVal)}</strong></span>`);
        if (showCoins) execStats.push(`<span class="exec-stat-pill">Coins <strong>${formatShortCurrency(coinsVal)}</strong></span>`);
        if (showViews) execStats.push(`<span class="exec-stat-pill">Views <strong>${formatShortCurrency(viewsVal)}</strong></span>`);

        const linksExec = links.map(link => {
          if (!link || !link.url) return '';
          const targetUrl = formatUrl(link.url);
          const icon = (link.icon && link.icon !== 'auto') ? link.icon : detectIcon(targetUrl);
          const redirectUrl = `https://account.syntiox.top/api/redirect?uid=${userData.uid||''}&key=${encodeURIComponent(link.title||'Link')}&url=${encodeURIComponent(targetUrl)}`;
          return `
            <a class="exec-link-strip" href="${esc(redirectUrl)}" target="_blank" rel="noopener noreferrer">
              <div class="exec-link-left">
                ${showIcons ? `<i class="${icon} exec-link-ic"></i>` : ''}
                <span class="exec-link-title">${esc(link.title || 'Link')}</span>
              </div>
              <i class="fa-solid fa-chevron-right exec-link-arrow"></i>
            </a>`;
        }).filter(Boolean).join('');

        contentHtml = `
          <div class="exec-container">
            ${editBtn}
            ${isAdmin
              ? `<div class="admin-avatar-wrap anim-item"><div class="admin-ring"></div><img class="exec-avatar" src="${avatarSrc}" alt="${esc(displayName||username)}" referrerpolicy="no-referrer" /></div>`
              : `<img class="exec-avatar anim-item" src="${avatarSrc}" alt="${esc(displayName||username)}" referrerpolicy="no-referrer" />`}
            <div class="anim-item">
              <h1 class="exec-name">${esc(displayName || username || 'User')}${verifiedBadge}${staffBadge}</h1>
              ${handleBtn}
            </div>
            ${bio ? `<p class="exec-bio anim-item anim-d1">${esc(bio)}</p>` : ''}
            ${execStats.length ? `<div class="exec-stats-row anim-item anim-d1">${execStats.join('')}</div>` : ''}
            ${socialHtml ? `<div class="social-row anim-item anim-d1" style="justify-content:center;">${socialHtml}</div>` : ''}
            ${linksExec ? `<div class="exec-links-stack anim-item anim-d2">${linksExec}</div>` : ''}
          </div>`;
      }

      document.getElementById('root').innerHTML = `
        ${contentHtml}
        <div class="syntiox-footer">
          <a href="https://account.syntiox.top" target="_blank" rel="noopener">
            <img src="/assets/image/logo.png" alt="Syntiox" />
            <span>Claim Yours</span>
          </a>
        </div>`;

      const copyBtn = document.getElementById('btn-copy-handle');
      if (copyBtn) {
        copyBtn.addEventListener('click', () => {
          function markCopied() {
            const ic = document.getElementById('copy-ic');
            if (!ic) return;
            ic.className = 'fa-solid fa-check';
            setTimeout(() => { ic.className = 'fa-regular fa-copy'; }, 1800);
          }
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(pageUrl).then(markCopied).catch(() => {});
          } else {
            const ta = document.createElement('textarea');
            ta.value = pageUrl;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); markCopied(); } catch {}
            document.body.removeChild(ta);
          }
        });
      }
    }

    function renderError(code, msg) {
      document.title = `${code} | Syntiox`;
      document.getElementById('root').innerHTML = `
        <div style="min-height:75vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;">
          <p style="font-family:var(--font-mono);font-size:12px;color:var(--pg-text-muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px;">${esc(code)}</p>
          <h1 style="font-family:var(--font-serif);font-size:32px;font-weight:500;margin-bottom:10px;">Profile Unavailable</h1>
          <p style="color:var(--pg-text-muted);font-size:14.5px;margin-bottom:24px;max-width:340px;">${msg}</p>
          <a href="/" style="display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;background:var(--pg-card-bg);border:1px solid var(--pg-card-border);font-size:13px;font-weight:500;">
            ← Back to Syntiox
          </a>
        </div>`;
    }

    async function main() {
      // 1. Instant render if pre-injected by serverless Redis cache
      if (window.__INITIAL_ERROR__) {
        renderError(window.__INITIAL_ERROR__.code, window.__INITIAL_ERROR__.msg);
        return;
      }

      if (window.__INITIAL_PROFILE__) {
        const data = window.__INITIAL_PROFILE__;
        if (data.isPublic === false) {
          renderError('Private', 'This profile has been set to private by its owner.');
          return;
        }
        render(data);
        return;
      }

      // 2. Fallback to client-side Firestore if page opened directly
      const params = new URLSearchParams(window.location.search);
      const pathMatch = window.location.pathname.match(/^\/u\/([^/]+)/);
      const handle = (pathMatch && pathMatch[1]) || params.get('handle') || params.get('u') || '';

      if (!handle) {
        renderError('404', 'No username was specified in the URL.');
        return;
      }

      try {
        const db = firebase.firestore();
        const uSnap = await db.collection('usernames').doc(handle.toLowerCase().trim()).get();
        if (!uSnap.exists) {
          renderError('404', `@${esc(handle)} is not registered on Syntiox.`);
          return;
        }

        const uData = uSnap.data();
        if (!uData || !uData.uid) {
          renderError('404', 'This profile could not be found.');
          return;
        }

        const snap = await db.collection('users').doc(uData.uid).get();
        if (!snap.exists) {
          renderError('404', 'This profile could not be found.');
          return;
        }

        const userData = snap.data();
        if (!userData) {
          renderError('404', 'This profile could not be found.');
          return;
        }

        if (userData.isPublic === false) {
          renderError('Private', 'This profile has been set to private by its owner.');
          return;
        }

        let isAdmin = false;
        try {
          const adminSnap = await db.collection('admin').doc(uData.uid).get();
          if (adminSnap.exists && adminSnap.data()?.isAdmin === true) {
            isAdmin = true;
          }
        } catch (_) {}

        render({ ...userData, uid: snap.id, isAdmin });
      } catch (err) {
        console.error('[Profile]', err);
        renderError('Error', 'Unable to load profile right now. Please try again shortly.');
      }
    }

    document.readyState === 'loading'
      ? document.addEventListener('DOMContentLoaded', main)
      : main();
  })();
  </script>
</body>
</html>
